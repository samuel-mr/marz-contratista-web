# Scripts de instalación permitidos. pnpm 10+ los bloquea por defecto como
# medida de cadena de suministro; esbuild los necesita para su binario.
allowBuilds:
  esbuild: true

# pnpm 11 retiene paquetes publicados hace muy poco (minimumReleaseAge).
# Estas exclusiones las añadió pnpm solo al instalar Astro 7.2.10.
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.11.0'
  - '@astrojs/markdown-satteri@0.4.0'
  - astro@7.2.10
