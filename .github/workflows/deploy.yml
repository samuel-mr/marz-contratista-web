# Despliegue del sitio Astro a GitHub Pages.
#
# Requiere: Settings > Pages > Source: GitHub Actions.
name: Deploy Astro site to Pages

on:
  # Cada push a la rama por defecto
  push:
    branches: ["main"]

  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Permisos del GITHUB_TOKEN para desplegar a Pages.
# id-token es necesario para el OIDC que usa deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez. No cancela el que esté en curso: los
# despliegues de producción deben poder terminar.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_PATH: "."

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # La versión de pnpm sale del campo `packageManager` de package.json,
      # así que CI y local usan exactamente la misma.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Astro 7 exige >=22.12. Las versiones impares no están soportadas.
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ${{ env.BUILD_PATH }}/pnpm-lock.yaml

      # Se queda aunque ya no se lean sus outputs: es el paso que habilita el
      # entorno de Pages del que depende deploy-pages.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # --frozen-lockfile: si package.json y pnpm-lock.yaml se desincronizan,
      # CI falla en vez de resolver por su cuenta y construir con versiones
      # distintas a las probadas en local.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ${{ env.BUILD_PATH }}

      # Sin --site ni --base: astro.config.mjs es la única fuente de verdad.
      #
      # Antes se pasaban desde los outputs de configure-pages. Eso ataba el
      # build al estado de Settings > Pages en el instante de ejecutarlo, y
      # produjo dos fallos reales:
      #   - el despliegue previo a conectar el dominio quedó con
      #     base=/marz-contratista-web cocido, y al activar el dominio todos
      #     los assets dieron 404;
      #   - `origin` llega como http:// mientras "Enforce HTTPS" esté apagado,
      #     lo que metía canonical URLs en http en el HTML.
      - name: Build with Astro
        run: pnpm build
        working-directory: ${{ env.BUILD_PATH }}
        # Umami: se definen en Settings > Secrets and variables > Actions >
        # Variables. Si faltan, el build sigue y el sitio queda sin analítica.
        env:
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_PATH }}/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
